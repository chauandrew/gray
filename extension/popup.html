<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="switch.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        background: #1c1c1e;
        color: #f2f2f2;
        margin: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header img {
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }
      header h1 {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
        flex: 1;
      }
      #snooze {
        margin-left: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        background: none;
        border: none;
        color: #9a9a9e;
        cursor: pointer;
        font: inherit;
        font-size: 10px;
        padding: 2px 4px;
      }
      #snooze:hover {
        color: #f2f2f2;
      }
      #snooze.active {
        color: var(--accent);
      }
      .snooze-icon-ring {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1.5px solid currentColor;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: #26292b;
        border-radius: 12px;
        padding: 10px 12px;
      }
      .row-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-sub {
        font-size: 11px;
        color: #9a9a9e;
      }
      .row-color {
        background: #26292b;
        border-radius: 12px;
        padding: 12px;
        text-align: center;
      }
      .row-color .row-label {
        margin-bottom: 8px;
      }
      button.dashboard {
        width: 100%;
        padding: 9px;
        font-size: 13px;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-text);
        cursor: pointer;
      }
      button.dashboard:hover {
        background: var(--accent-hover);
      }
      #dashboard {
        background: transparent;
        color: #9a9a9e;
        font-weight: 500;
      }
      #dashboard:hover {
        background: transparent;
        color: #f2f2f2;
        text-decoration: underline;
      }
      #stat {
        margin-top: -4px;
        text-align: center;
        font-size: 12px;
        color: #9a9a9e;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/32.png" alt="" />
      <h1>Gray</h1>
      <button id="snooze" title="Pause for 5 minutes" aria-label="Pause for 5 minutes">
        <span class="snooze-icon-ring">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1" />
            <rect x="14" y="4" width="4" height="16" rx="1" />
          </svg>
        </span>
        <span id="snoozeLabel">5 min</span>
      </button>
    </header>

    <div class="row">
      <div class="row-label">Enabled everywhere</div>
      <label class="switch">
        <input type="checkbox" id="enabled" disabled />
        <span class="track"></span>
        <span class="thumb"></span>
      </label>
    </div>

    <div class="row">
      <div>
        <div class="row-label">Block images here</div>
        <div class="row-sub" id="host">this site</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="blockHere" disabled />
        <span class="track"></span>
        <span class="thumb"></span>
      </label>
    </div>

    <div class="row-color">
      <div class="row-label">Box color</div>
      <div id="colorSwatches" style="display: flex; gap: 8px; justify-content: center;"></div>
    </div>

    <button class="dashboard" id="dashboard">Manage exempt sites</button>

    <div id="stat">You've blocked 0 images so far.</div>

    <script src="match.js"></script>
    <script src="stat.js"></script>
    <script src="colors.js"></script>
    <script src="snooze.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
