name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Cypress's own binary and the Chrome for Testing build cypress.config.js
      # fetches via @puppeteer/browsers both land here — neither is covered by
      # setup-node's npm cache, since both download at a step after npm
      # install (Cypress via postinstall, Chrome for Testing lazily inside
      # cypress.config.js the first time tests actually run).
      - name: Cache browser binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Cypress
            ~/.cache/puppeteer
          key: browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npm test
